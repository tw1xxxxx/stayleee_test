server {
    listen 80;
    server_name 194.67.100.225;

    client_max_body_size 50M; # Increased for large images

    access_log /var/log/nginx/staysee_access.log;
    error_log /var/log/nginx/staysee_error.log;

    # Static assets serving (using root is safer than alias)
    location /images/ {
        root /var/www/staysee/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location /videos/ {
        root /var/www/staysee/public;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # Range Requests support for video seeking
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        types {
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            video/quicktime MOV;
        }
        try_files $uri =404;
    }

    # Proxy to Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
